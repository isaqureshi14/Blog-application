<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Article — BlogVerse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="brand-logo">BlogVerse<span class="brand-dot">.</span></a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#explore">Explore</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="create-blog.html" class="active">Write</a></li>
        </ul>
        <div class="nav-right">
          <button class="theme-toggle-btn" type="button" aria-label="Toggle theme"></button>
          <a href="dashboard.html" class="btn btn-ghost btn-sm" style="border-left:1px solid var(--border); height:var(--header-height); padding:0 1.25rem; border-top:none; border-bottom:none; border-right:none;">Dashboard</a>
          <button class="mobile-menu-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="square" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════
       EDITOR — Main area + Settings sidebar
  ════════════════════════════════════════════════════════════════ -->
  <main class="editor-layout">

    <!-- Left: Writing area -->
    <div class="editor-main">
      <form id="createBlogForm">

        <div class="editor-topbar">
          <div class="editor-topbar-label">New article</div>
          <div class="editor-topbar-actions">
            <button type="button" class="btn btn-ghost btn-sm" onclick="alert('Draft saved.')">Save draft</button>
            <button type="submit" class="btn btn-primary btn-sm">Publish</button>
          </div>
        </div>

        <!-- Title -->
        <input
          type="text"
          class="title-input"
          placeholder="Article title..."
          required
          id="postTitle"
          name="postTitle"
        >

        <!-- Toolbar -->
        <div class="editor-toolbar-row">
          <button type="button" class="tool-btn" title="Bold" onclick="insertText('**bold**')"><strong>B</strong></button>
          <button type="button" class="tool-btn" title="Italic" onclick="insertText('*italic*')"><em>I</em></button>
          <button type="button" class="tool-btn" title="Strikethrough" onclick="insertText('~~strike~~')">S̶</button>
          <button type="button" class="tool-btn" title="H2" onclick="insertText('\n## Heading\n')">H2</button>
          <button type="button" class="tool-btn" title="H3" onclick="insertText('\n### Heading\n')">H3</button>
          <button type="button" class="tool-btn" title="Quote" onclick="insertText('\n> Blockquote\n')">&ldquo;&rdquo;</button>
          <button type="button" class="tool-btn" title="Code" onclick="insertText('`code`')">&lt;/&gt;</button>
          <button type="button" class="tool-btn" title="Code block" onclick="insertText('\n```\n// code\n```\n')">{ }</button>
          <button type="button" class="tool-btn" title="Link" onclick="insertText('[text](url)')">&#8599;</button>
          <button type="button" class="tool-btn" title="Bullet list" onclick="insertText('\n- Item\n- Item\n')">— List</button>
        </div>

        <textarea
          id="postContent"
          class="form-textarea editor-textarea"
          placeholder="Start writing your article here...

You can use Markdown syntax:
- **bold**, *italic*, ~~strike~~
- ## Headings
- > Blockquotes
- ```code blocks```
- [Links](url)"
          required
          name="postContent"
        ></textarea>

        <!-- Excerpt -->
        <div class="form-group" style="margin-top:1.5rem;">
          <label for="postExcerpt" class="form-label">Excerpt</label>
          <input type="text" id="postExcerpt" class="form-input" placeholder="A short summary shown on the homepage feed and in search results." name="postExcerpt">
        </div>

      </form>
    </div>

    <!-- Right: Publish settings sidebar -->
    <aside class="editor-sidebar">

      <div class="sidebar-section">
        <div class="sidebar-label">Publish settings</div>
        <div class="form-group">
          <label for="postCategory" class="form-label">Category</label>
          <select id="postCategory" class="form-select" name="postCategory" required style="cursor:pointer;">
            <option value="">Select...</option>
            <option value="tech">Technology</option>
            <option value="design">Design</option>
            <option value="career">Career</option>
            <option value="lifestyle">Lifestyle</option>
          </select>
        </div>
        <div class="form-group">
          <label for="postTags" class="form-label">Tags</label>
          <input type="text" id="postTags" class="form-input" placeholder="html, css, webdev" name="postTags">
        </div>
        <div class="form-group">
          <label for="publishDate" class="form-label">Publish date</label>
          <input type="date" id="publishDate" class="form-input" name="publishDate">
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Cover image</div>
        <div
          class="upload-zone"
          onclick="document.getElementById('featuredImageInput').click()"
          id="uploadZone"
        >
          <div id="imgPreviewContainer">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="0"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>Click to upload cover image</p>
            <p style="font-size:0.7rem; opacity:0.6; margin-top:0.25rem;">JPG, PNG, WEBP · max 5 MB</p>
          </div>
          <input type="file" id="featuredImageInput" accept="image/*" style="display:none;" name="featuredImage">
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Author</div>
        <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem;">
          <img
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=60&q=80"
            alt="Alex Morgan"
            style="width:36px; height:36px; object-fit:cover; filter:grayscale(60%);"
          >
          <div>
            <div style="font-size:0.875rem; font-weight:600;">Alex Morgan</div>
            <div style="font-family:var(--font-mono); font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted);">Author</div>
          </div>
        </div>
      </div>

      <div class="sidebar-section" style="border-bottom:none; margin-bottom:0;">
        <div style="display:flex; gap:0.5rem; flex-direction:column;">
          <button type="submit" form="createBlogForm" class="btn btn-primary" style="width:100%; height:44px;">Publish article</button>
          <a href="dashboard.html" class="btn btn-ghost" style="width:100%; height:44px;">Cancel</a>
        </div>
      </div>

    </aside>
  </main>

  <script>
    function insertText(text) {
      const ta = document.getElementById('postContent');
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + text + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = start + text.length;
      ta.focus();
    }
  </script>
  <script src="js/main.js"></script>
</body>
</html>
